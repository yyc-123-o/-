[project]
name = "skillforge-kb"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.11,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "pydantic-settings>=2.10,<3",
  "langchain-core>=0.3.68,<1",
  "langchain-community>=0.3.27,<1",
  "langchain-text-splitters>=0.3.8,<1",
  "qdrant-client[fastembed]>=1.14,<2",
  "neo4j>=5.28,<6",
  "psycopg[binary,pool]>=3.2.9,<4",
  "pymupdf>=1.26,<2",
  "trafilatura>=2.0,<3",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "tenacity>=9.1,<10",
  "structlog>=25.4,<26",
  "langgraph>=0.6,<1",
  "langgraph-checkpoint-sqlite>=3,<4",
  "scipy>=1.13,<2",
]

[project.scripts]
skillforge-kb = "skillforge_kb.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
    "respx>=0.22,<1",
    "types-PyYAML>=6.0.12,<7",
    "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "testcontainers[postgres,neo4j]>=4.10,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires local services or Docker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["skillforge_kb"]
