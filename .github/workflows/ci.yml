name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Test platform packages
        run: uv run pytest -q
      - name: Test learner diagnosis agent
        run: uv run pytest -q "学情诊断Agent"
